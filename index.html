<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Mikulás személyes levele</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  color: #3b241b;
  background: #f5ead6;
}

header {
  text-align: center;
  padding: 40px 15px;
  color: #fff0d0;
  background: linear-gradient(135deg, #12384b, #8d101c);
}

h1 {
  font-size: clamp(30px, 6vw, 48px);
}

main {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  padding: 25px;
  background: #fffaf0;
  border: 2px solid #c99b5a;
  border-radius: 18px;
  box-shadow: 0 8px 24px #48200f22;
}

h2 {
  color: #9b1520;
}

.letter {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.9;
  font-size: 19px;
  padding: 22px;
  background: white;
  border-left: 4px solid #d6ad64;
  border-radius: 8px;
}

.video {
  margin-top: 25px;
  padding: 18px;
  text-align: center;
  background: white;
  border-radius: 12px;
}

.placeholder {
  padding: 30px 10px;
  color: white;
  background: linear-gradient(135deg, #17384b, #8d101c);
  border-radius: 10px;
}

.santa {
  font-size: 75px;
}

video {
  width: 100%;
  max-height: 450px;
}

footer {
  text-align: center;
  padding: 25px;
  background: #690d16;
  color: #ffe9bc;
}
</style>
</head>

<body>

<header>
  <div>❄ Üzenet az Északi-sarkról ❄</div>
  <h1>🎅 A Mikulás levele 🎄</h1>
  <p>Egy különleges, személyes meglepetés!</p>
</header>

<main>
  <section class="card">

    <h2 id="koszontes">A Mikulás üzenete</h2>

    <div id="level" class="letter">
      A Mikulás levele hamarosan megérkezik.
    </div>

    <div class="video">
      <h2>🎬 A Mikulás videóüzenete</h2>

      <div id="videoHely" class="placeholder">
        <div class="santa">🎅</div>
        <strong>Üdvözlet az Északi-sarkról!</strong>
        <p>A Mikulás videója itt jelenhet meg.</p>
      </div>

      <video
        id="mikulasVideo"
        controls
        playsinline
        hidden>
      </video>
    </div>

  </section>
</main>

<footer>
  ❄ Kellemes ünnepeket kíván a Mikulás! ❄
</footer>

<script>
/*
  AJÁNDÉKOZÓI BEÁLLÍTÁS

  A neveket és a leveleket TE írod be.
  A megajándékozottnak nincs névbeviteli mezője.

  Minden személyhez külön azonosító tartozik.
  A régi bejegyzéseket hagyd meg,
  ha a régi QR-kódokat is használni szeretnéd.
*/

const AJANDEKOK = {

  "csomag1": {
    nev: "IDE ÍRD AZ ELSŐ SZEMÉLY NEVÉT",

    level: `Kedves IDE ÍRD A NEVÉT!

A Mikulás idén is szeretne neked
egy különleges meglepetést küldeni.

IDE ÍRD A SZEMÉLYES LEVELET!

Kívánok neked sok örömet,
boldogságot és csodás ünnepeket!

Szeretettel:
A Mikulás 🎅`,

    video: ""
  },

  "csomag2": {
    nev: "IDE ÍRD A MÁSODIK SZEMÉLY NEVÉT",

    level: `Kedves IDE ÍRD A NEVÉT!

Ez a levél csak neked készült.

IDE ÍRD A MÁSODIK SZEMÉLY LEVELÉT!

Kellemes Mikulás-napot kívánok!

Szeretettel:
A Mikulás 🎅`,

    video: ""
  }

};

const parameterek = new URLSearchParams(location.search);
const azonosito = parameterek.get("ajandek");
const adat = azonosito ? AJANDEKOK[azonosito] : null;

if (adat) {

  document.getElementById("koszontes").textContent =
    "Kedves " + adat.nev + "!";

  document.getElementById("level").textContent =
    adat.level;

  if (adat.video && adat.video.trim() !== "") {

    const video = document.getElementById("mikulasVideo");

    video.src = adat.video;
    video.hidden = false;

    document.getElementById("videoHely").hidden = true;
  }

} else {

  document.getElementById("koszontes").textContent =
    "🎅 A Mikulás üzenete";

  document.getElementById("level").textContent =
    "Ez a Mikulás-levél nem található. " +
    "Ellenőrizd a QR-kódot!";

  document.querySelector(".video").hidden = true;

}
</script>

</body>
</html>
