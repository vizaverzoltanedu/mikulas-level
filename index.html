<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b23">
<title>A Mikulás személyes levele 🎅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --green:#102b23;
  --green2:#194337;
  --red:#8e2033;
  --red2:#b92e43;
  --gold:#e6c477;
  --cream:#fff7e7;
  --ink:#382a24;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;
  color:var(--cream);
  background:
    radial-gradient(ellipse at top,#285344 0%,transparent 48%),
    linear-gradient(145deg,#091c17,var(--green) 52%,#35151f);
  overflow-x:hidden;
}
button,input,textarea{font:inherit}
button{
  border:1px solid #d7b65f;border-radius:12px;padding:12px 17px;
  margin:7px 5px 0 0;background:linear-gradient(135deg,var(--red2),var(--red));
  color:white;font-family:Arial,sans-serif;font-weight:bold;cursor:pointer;
  box-shadow:0 5px 15px #0003;transition:transform .18s,filter .18s;
}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:wait;transform:none}
button.secondary{background:#29483d;border-color:#6c947c}
button.danger{background:#6e1927;border-color:#a94b57}
input,textarea{
  display:block;width:100%;padding:13px 14px;border-radius:10px;
  border:1px solid #cbbd9e;background:#fffdf7;color:#30271f;
}
input:focus,textarea:focus{outline:3px solid #e6c47766;border-color:#b28a39}
textarea{min-height:155px;resize:vertical;line-height:1.6}
label{display:block;margin:16px 0 7px;font:bold 14px Arial,sans-serif;color:#f2d996}
a{color:#f1d38c;overflow-wrap:anywhere}
header{
  position:relative;text-align:center;padding:35px 16px 29px;
  background:linear-gradient(135deg,#102d24eF,#641a2aeF);
  border-bottom:2px solid var(--gold);overflow:hidden;
}
header:before,header:after{
  content:"✦";position:absolute;color:#e9cb7c99;font-size:50px;top:15px;
}
header:before{left:8%}header:after{right:8%}
header h1{margin:0 0 9px;font-size:clamp(27px,5vw,46px);color:#ffe8ad;text-shadow:0 2px 18px #e5b94a44}
header p{margin:0;color:#e6e8d9;font:14px Arial,sans-serif;letter-spacing:.5px}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:3px;color:var(--gold);margin-bottom:12px}
main{max-width:920px;margin:25px auto;padding:0 14px 45px}
.panel{
  position:relative;background:linear-gradient(145deg,#17382eF5,#10271ff5);
  border:1px solid #b8944c88;border-radius:22px;padding:clamp(18px,4vw,32px);
  margin-bottom:20px;box-shadow:0 18px 45px #0004;
}
h2{color:#f1d38c;margin:0 0 15px;font-size:clamp(22px,4vw,29px)}
h3{color:#f1d38c}
.small{font:13px/1.6 Arial,sans-serif;color:#c6d4c8}
.status{
  padding:12px;border-radius:10px;background:#ffffff0d;
  border:1px solid #d6bd7a55;white-space:pre-wrap;overflow-wrap:anywhere;
  margin:12px 0;font:14px/1.6 Arial,sans-serif;color:#f9e9c3;
}
.hidden{display:none!important}
label.file-label{margin-top:19px}
hr{border:0;border-top:1px solid #e5ca8250;margin:24px 0}
.entry{
  border:1px solid #d7bc7655;border-radius:15px;padding:17px;
  margin-top:14px;background:#ffffff08;overflow-wrap:anywhere;
}
.entry h3{margin:0 0 6px}
.entry a{display:inline-block;margin:8px 0}
.qr{
  display:block;width:200px;height:200px;object-fit:contain;
  margin:15px auto;background:white;border-radius:12px;padding:8px;
}
.letter-shell{
  position:relative;overflow:hidden;margin-top:20px;padding:clamp(20px,5vw,42px);
  border-radius:20px;border:1px solid #d8b85e;
  background:
    radial-gradient(ellipse at 50% 0%,#ffffff12,transparent 65%),
    linear-gradient(145deg,#1c4738,#102d25 75%);
  box-shadow:inset 0 0 35px #0002,0 12px 35px #0003;
}
.letter-shell:before{
  content:"";position:absolute;inset:8px;border:1px solid #d8b85e55;
  border-radius:14px;pointer-events:none;
}
.letter-top{text-align:center;position:relative}
.santa-medallion{
  width:76px;height:76px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;font-size:40px;
  background:linear-gradient(145deg,#a52c3c,#671726);
  border:2px solid var(--gold);box-shadow:0 0 25px #e7c46a26;
}
.letter-kicker{font:11px Arial,sans-serif;letter-spacing:3px;color:var(--gold)}
.letter-title{
  font-size:clamp(27px,6vw,43px);line-height:1.2;
  margin:12px 0;color:#ffe7a7;text-shadow:0 0 20px #e8c16b22;
}
.letter-rule{color:var(--gold);letter-spacing:8px;margin:17px 0 25px}
.greeting{font-size:clamp(21px,4vw,28px);color:#ffe7a7;margin:0 0 18px}
.letter{
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(17px,3vw,20px);
  line-height:1.9;color:#fff6e4;position:relative;
}
.signature{text-align:right;margin-top:30px;color:#e6c477;line-height:1.8}
.signature strong{font-size:25px;display:block}
.media-card{
  margin-top:23px;padding:18px;border-radius:16px;
  background:#071a1488;border:1px solid #d6b45b66;
}
.media-card h3{margin:0 0 12px;font-size:19px}
audio{width:100%;margin-top:8px}
.media{display:block;width:100%;max-height:500px;margin-top:10px;border-radius:12px;background:#000}
.certificate-card{
  margin-top:23px;padding:20px;border-radius:16px;text-align:center;
  background:linear-gradient(140deg,#49391c,#1b352b);
  border:1px solid var(--gold);
}
.certificate-icon{font-size:42px;margin-bottom:8px}
.certificate-card h3{margin:4px 0 8px}
.certificate-card p{color:#f5e6c4;line-height:1.6}
.certificate-preview{
  display:block;max-width:100%;max-height:450px;object-fit:contain;
  margin:15px auto;border-radius:8px;background:white;
}
.snowflake{
  position:fixed;top:-25px;z-index:20;pointer-events:none;
  color:#fff9e8;text-shadow:0 0 8px #fff;
  animation:fall linear forwards;opacity:.85;
}
@keyframes fall{
  0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:0}
  10%{opacity:.85}
  90%{opacity:.7}
  100%{transform:translate3d(35px,110vh,0) rotate(280deg);opacity:0}
}
.sparkle{color:#e9cb7c;animation:glow 2.5s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 4px #e9cb7c33}to{text-shadow:0 0 17px #e9cb7cbb}}
footer{text-align:center;padding:18px 12px 28px;color:#d7c99e;font:13px Arial,sans-serif}
@media(max-width:600px){
  header{padding:29px 12px 24px}
  header:before{left:3%;font-size:30px}
  header:after{right:3%;font-size:30px}
  main{margin:16px auto;padding:0 10px 28px}
  .panel{border-radius:17px;padding:18px}
  .letter-shell{padding:22px 17px}
  .qr{width:180px;height:180px}
  button{max-width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>
</head>
