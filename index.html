<label for="audioFile">🎵 MP3 hangfájl</label>
<input id="audioFile" type="file" accept=".mp3,audio/mpeg">

<label for="videoFile">🎬 MP4 videófájl</label>
<input id="videoFile" type="file" accept=".mp4,video/mp4">
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikuláslevelek – Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4eee4;color:#263238}
header{background:#a81728;color:white;text-align:center;padding:24px 12px}
main{max-width:800px;margin:25px auto;padding:12px}
section{background:white;padding:20px;margin-bottom:20px;border-radius:12px}
input,textarea,button{display:block;width:100%;padding:12px;margin:10px 0;font-size:16px}
textarea{min-height:160px}
button{background:#176b45;color:white;border:0;border-radius:7px;cursor:pointer}
.item{border:1px solid #ddd;border-radius:8px;padding:15px;margin:12px 0}
a{overflow-wrap:anywhere}
.hidden{display:none}
.letter {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.9;
  font-size: 19px;
  padding: 30px;
  background: linear-gradient(135deg, #fff8e7, #ffe4e1, #e4f5e9);
  border: 3px solid #b22222;
  border-radius: 18px;
  box-shadow: 0 8px 22px rgba(120, 30, 30, 0.18);
  color: #3b2020;
  position: relative;
}
</style>
</head>
<body>

<header>
<h1>🎅 A Mikulás személyes levelei 🎄</h1>
<p>Adminisztrációs felület</p>
</header>

<main>

<section id="login">
<h2>🔐 Admin belépés</h2>
<input id="jelszo" type="password" placeholder="Admin jelszó">
<button onclick="belepes()">Belépés</button>
<p id="hiba"></p>
</section>

<div id="admin" class="hidden">

<section>
<h2>🎁 Új Mikulás-levél</h2>

<label for="nev">Megajándékozott neve</label>
<input id="nev" placeholder="Például: Bence">

<label for="uzenet">Személyes levél</label>
<textarea id="uzenet" placeholder="Írd ide a levelet..."></textarea>

<label for="video">Videó linkje (nem kötelező)</label>
<label for="video">Mikulás-videó (MP4)</label>
<input id="videoFile" type="file" accept="video/mp4,video/*">

<label for="audioFile">Mikulás-hangüzenet (MP3)</label>
<input id="audioFile" type="file" accept="audio/mpeg,audio/mp3">

<button onclick="mentes()">Levél mentése</button>
<p id="eredmeny"></p>
</section>

<section>
<h2>📜 Korábbi levelek</h2>
<div id="lista"></div>
</section>

</div>

<section id="olvaso" class="hidden">
<h2>🎅 Személyes Mikulás-levél</h2>
<h3 id="olvasoNev"></h3>
<p id="olvasoLevel" class="letter"></p>
<a id="olvasoVideo" target="_blank" rel="noopener noreferrer"></a>
</section>

</main>

<script>
const KULCS="mikulas_levelek_v1";
const ADMIN_JELSZO="Mikulas2026!";
let szerkesztettId=null;

function betolt(){
 try{return JSON.parse(localStorage.getItem(KULCS)||"[]")}
 catch(e){return []}
}

function tarol(adatok){
 localStorage.setItem(KULCS,JSON.stringify(adatok));
}

function belepes(){
 if(document.getElementById("jelszo").value===ADMIN_JELSZO){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("admin").classList.remove("hidden");
  listaFrissit();
 }else{
  document.getElementById("hiba").textContent="Hibás jelszó!";
 }
}

function link(id){
 return location.origin+location.pathname+"?level="+encodeURIComponent(id);
}

function mentes(){
 const nev=document.getElementById("nev").value.trim();
 const uzenet=document.getElementById("uzenet").value.trim();
 const video=document.getElementById("video").value.trim();

 if(!nev||!uzenet){
  alert("Töltsd ki a nevet és a levelet!");
  return;
 }

 const adatok=betolt();

 if(szerkesztettId){
  const level=adatok.find(x=>x.id===szerkesztettId);
  if(level){
   level.nev=nev;
   level.uzenet=uzenet;
   level.video=video;
  }
  szerkesztettId=null;
 }else{
  const id=crypto.randomUUID
   ?crypto.randomUUID()
   :Date.now().toString(36)+Math.random().toString(36).slice(2);

  adatok.push({id,nev,uzenet,video});
 }

 tarol(adatok);

 document.getElementById("nev").value="";
 document.getElementById("uzenet").value="";
 document.getElementById("video").value="";
 document.getElementById("eredmeny").textContent="A levél mentve.";

 listaFrissit();
}

function listaFrissit(){
 const lista=document.getElementById("lista");
 lista.replaceChildren();

 betolt().forEach(level=>{
  const elem=document.createElement("div");
  elem.className="item";

  const cim=document.createElement("strong");
  cim.textContent=level.nev;

  const a=document.createElement("a");
  a.href=link(level.id);
  a.textContent="Személyes levél megnyitása";
  a.target="_blank";
  a.style.display="block";

  const qr=document.createElement("a");
  qr.href="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(link(level.id));
  qr.textContent="QR-kód megnyitása";
  qr.target="_blank";
  qr.style.display="block";

  const edit=document.createElement("button");
  edit.textContent="Szerkesztés";
  edit.onclick=()=>{
   document.getElementById("nev").value=level.nev;
   document.getElementById("uzenet").value=level.uzenet;
   document.getElementById("video").value=level.video||"";
   szerkesztettId=level.id;
   window.scrollTo({top:0,behavior:"smooth"});
  };

  const torol=document.createElement("button");
  torol.textContent="Törlés";
  torol.style.background="#a81728";
  torol.onclick=()=>{
   if(confirm("Biztosan törlöd ezt a levelet?")){
    tarol(betolt().filter(x=>x.id!==level.id));
    listaFrissit();
   }
  };

  elem.append(cim,a,qr,edit,torol);
  lista.appendChild(elem);
 });
}

function levelMegnyit(){
 const id=new URLSearchParams(location.search).get("level");
 if(!id)return;

 document.getElementById("login").classList.add("hidden");
 document.getElementById("admin").classList.add("hidden");
 document.getElementById("olvaso").classList.remove("hidden");

 const level=betolt().find(x=>x.id===id);

 document.getElementById("olvasoNev").textContent=
  level?"Kedves "+level.nev+"!":"A levél nem található";

 document.getElementById("olvasoLevel").textContent=
  level?level.uzenet:"Ez a levél ebben a böngészőben nem található.";

 const video=document.getElementById("olvasoVideo");

 if(level&&level.video){
  try{
   const url=new URL(level.video);
   if(url.protocol==="https:"||url.protocol==="http:"){
    video.href=url.href;
    video.textContent="🎬 Mikulás-videó megtekintése";
   }
  }catch(e){}
 }
}

levelMegnyit();
</script>

</body>
</html>
